name: Backend

on:
  push:
    branches: [main]
    paths: ["backend/**", "pyproject.toml", ".github/workflows/backend.yml"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# One deploy at a time; a second push waits instead of overlapping the first.
concurrency:
  group: backend-deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: aei, POSTGRES_PASSWORD: aei, POSTGRES_DB: aei }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aei" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]"
      - run: ruff check backend
      - run: pytest

  # Runs at the same time as the tests. Without the file the app spends minutes computing the
  # same numbers on the small App Service plan after every deploy.
  signals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e .
      - run: python scripts/build_signals.py
      - uses: actions/upload-artifact@v4
        with:
          name: signals-cache
          path: backend/app/signals_cache.json
          if-no-files-found: error
          retention-days: 3

  deploy:
    needs: [test, signals]
    runs-on: ubuntu-latest
    # The App Service build takes about 5 minutes; this is only a ceiling for a run that really is stuck.
    timeout-minutes: 25
    env:
      RG: rg-junctionturku
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Fetch the precomputed alert signals
        uses: actions/download-artifact@v4
        with:
          name: signals-cache
          path: backend/app
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Build the zip (app code and a requirements.txt for the App Service build; the data comes from Postgres)
        run: |
          mkdir -p stage && cp -r backend/app stage/app
          python - <<'PY'
          import tomllib
          deps = tomllib.load(open("pyproject.toml", "rb"))["project"]["dependencies"]
          open("stage/requirements.txt", "w").write("\n".join(deps) + "\n")
          PY
          (cd stage && zip -qr ../backend.zip .)
      - name: Deploy
        run: |
          APP=$(az webapp list -g "$RG" --query "[?tags.project=='aei' && tags.env=='demo'].name | [0]" -o tsv)
          echo "APP=$APP" >> "$GITHUB_ENV"
          STARTED=$(date -u -d '60 seconds ago' +%Y-%m-%dT%H:%M:%SZ)  # margin for clock differences with Azure
          # `az webapp deploy` holds one long request open while App Service builds (about 4 to 5 minutes,
          # even with --async), and the gateway in front cuts a request off at about 230 s. That once failed
          # this step although the deployment had succeeded. So the CLI's exit code is not trusted: App
          # Service's own deployment record decides, read with short requests.
          CLI_OK=true
          az webapp deploy -g "$RG" -n "$APP" --src-path backend.zip --type zip --clean true --async true || CLI_OK=false
          [[ "$CLI_OK" == true ]] || echo "az reported an error; checking the deployment record instead"
          for i in $(seq 1 90); do
            # The scm site sometimes answers with a 504 after minutes. Cap each call, and treat a failed one as
            # "nothing yet" (read returns 1 on empty output, which would end this step under bash -e).
            RECEIVED="" STATUS="" COMPLETE=""
            read -r RECEIVED STATUS COMPLETE < <(timeout 60 az webapp log deployment list -g "$RG" -n "$APP" \
              --query "[0:1].[received_time,status,complete]" -o tsv 2>/dev/null) || true
            if [[ "$RECEIVED" > "$STARTED" ]]; then
              echo "attempt $i: received=$RECEIVED status=$STATUS complete=$COMPLETE"
              [[ "$COMPLETE" == "True" && "$STATUS" == "4" ]] && exit 0
              [[ "$STATUS" == "3" ]] && { echo "Deployment failed"; exit 1; }
            else
              echo "attempt $i: no new deployment recorded yet"
              # the upload never arrived: give up after 3 minutes instead of waiting for the full timeout
              [[ "$CLI_OK" == false && $i -ge 18 ]] && { echo "az failed and App Service has no new deployment"; exit 1; }
            fi
            sleep 10
          done
          echo "Timed out waiting for the deployment"; exit 1
      - name: Check /healthz
        run: |
          HOST=$(az webapp show -g "$RG" -n "$APP" --query defaultHostName -o tsv)
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://$HOST/healthz" || true)
            echo "attempt $i: $code"; [ "$code" = 200 ] && exit 0; sleep 15
          done
          exit 1
      - name: Check a route that reads the dataset
        run: |
          HOST=$(az webapp show -g "$RG" -n "$APP" --query defaultHostName -o tsv)
          curl -fsS --max-time 120 "https://$HOST/v1/susceptibility?ward=URO&organism=Escherichia%20coli&drug=CRO&specimen=urine" \
            | python -c "import json,sys; d=json.load(sys.stdin); n=d['annual']['rows'][0]['resistance']['n']; print('annual n =', n); sys.exit(0 if n > 0 else 1)"
      - name: Check the database row counts
        run: |
          HOST=$(az webapp show -g "$RG" -n "$APP" --query defaultHostName -o tsv)
          # Right after a deploy both workers spend about a minute computing the alert signals and the
          # gateway can answer 502 meanwhile, so ask again for up to two minutes.
          for i in $(seq 1 8); do
            if curl -fsS --max-time 60 "https://$HOST/v1/data-status" -o status.json; then
              python - <<'PY' && exit 0
          import json, sys
          d = json.load(open("status.json"))
          for t, v in d["tables"].items():
              print(f"{t:<16}{v['expected']:>10}{v['actual']:>10}")
          print("signals:", d["signals"])
          ok = d["ok"] and d["signals"]["source"] == "precomputed"  # computing them on the small plan takes minutes
          sys.exit(0 if ok else 1)
          PY
            fi
            echo "attempt $i did not pass; waiting"; sleep 15
          done
          exit 1
