[project]
name = "amiright"
version = "0.1.0"
description = "AMRight: continuously updated antimicrobial resistance monitoring"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "gunicorn>=22",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pandas>=2.2",
    "scipy>=1.13",
    "psycopg[binary]>=3.2",
    "anthropic>=1.15,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
markers = ["live: calls the real Claude API (needs ANTHROPIC_API_KEY); run with -m live"]
addopts = "-m \"not live\""
pythonpath = ["backend"]
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 100
